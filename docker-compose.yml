services:
  postgres:
    image: postgres:16-alpine
    container_name: noir-postgres
    environment:
      POSTGRES_USER: noir
      POSTGRES_PASSWORD: noir
      POSTGRES_DB: noir
    ports:
      - "5432:5432"
    volumes:
      - noir_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noir -d noir"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noir-redis
    ports:
      - "6379:6379"
    volumes:
      - noir_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: noir-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - noir_qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: noir-elastic
    profiles: ["elastic"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - noir_es_data:/usr/share/elasticsearch/data

volumes:
  noir_pg_data:
  noir_redis_data:
  noir_qdrant_data:
  noir_es_data:

