<!DOCTYPE html>
<html lang="en" data-font-scale="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noir Atelier — Admin Governance Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/packages/ui/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="noir-app"></div>
    <script type="module">
      import "/app.js";
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const mgrSelect = document.querySelector('[data-action="change-actor"]');
          if (mgrSelect) {
            mgrSelect.value = "admin_manager";
            mgrSelect.dispatchEvent(new Event("change", { bubbles: true }));
          }
          const adminBtn = document.querySelector('[data-surface="admin"]');
          if (adminBtn) adminBtn.click();
        }, 120);
      });
    </script>
  </body>
</html>
